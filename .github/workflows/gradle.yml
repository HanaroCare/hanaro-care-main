name: Java Spring CI & EC2 Deploy

on:
  push:
    branches: [ release/spring ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # [1] Spring 빌드 체크 (GitHub 가상 환경에서 사전 검증)
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: server

      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test -x jacocoTestCoverageVerification
        working-directory: server

      # [2] EC2 접속 후 실제 배포 진행
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WAS }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/workspace/hanaro-care-main
            
            # 1. 최신 코드 풀
            git pull origin release/spring
            
            # 2. 백엔드(Spring) 배포
            cd server
            # RDS 정보를 포함한 환경변수 파일(.env 등)이 있다면 여기서 적용
            # echo "${{ secrets.ENV }}" > .env 
            ./gradlew build -x test
            pm2 reload hanacare
            
            # 3. 프론트엔드(Next.js) 배포
            cd ../client
            npm install --legacy-peer-deps
            npm run build
            pm2 reload hanacare
