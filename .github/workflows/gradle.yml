name: Java Spring CI & EC2 Deploy

on:
  push:
    branches: [ release/spring ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # [1] JDK 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # [2] 보안 파일 주입 (security.yaml만 생성)
      - name: Create Security Files
        run: |
          mkdir -p server/src/main/resources
          echo "${{ secrets.SECURITY_YAML }}" > server/src/main/resources/security.yaml
        shell: bash

      # [3] Gradle 빌드
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test
        working-directory: server

      # [4] JAR 파일 EC2 전송
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.WAS }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          source: "server/build/libs/*.jar"
          target: "~/workspace/hanaro-care-main/server/build/libs"
          strip_components: 2

      # [5] EC2에서 실행 (PM2)
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WAS }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/workspace/hanaro-care-main/server
            pm2 reload hanacare-server || pm2 start build/libs/*.jar --name "hanacare-server"
