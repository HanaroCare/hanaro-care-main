name: Java Spring CI & EC2 Deploy

on:
  push:
    branches: [ release/spring ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # [1] GitHub 가상환경에서 Spring 빌드 체크
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: server

      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test
        working-directory: server

      # [2] EC2 접속 후 실제 자동 배포 실행
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WAS }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. 프로젝트 폴더 이동 및 최신화
            cd ~/workspace/hanaro-care-main
            git pull origin release/spring
            
            # 2. [Back-end] Spring Boot 배포
            cd server
            ./gradlew build -x test
            # 백엔드용 PM2를 'hanacare-server'라는 이름으로 관리합니다.
            # 이미 켜져있으면 재시작, 꺼져있으면 새로 시작합니다.
            pm2 reload hanacare-server || pm2 start build/libs/*.jar --name "hanacare-server"
            
            # 3. [Front-end] Next.js 배포
            cd ../client
            npm install --legacy-peer-deps
            npm run build
            # 기존 'hanacare'라는 이름으로 돌아가는 프론트엔드를 재시작합니다.
            pm2 reload hanacare
