name: Java Spring CI & EC2 Deploy

on:
  push:
    branches: [ release/spring ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: server

      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test -x jacocoTestCoverageVerification
        working-directory: server

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WAS }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/workspace/hanaro-care-main
            git pull origin release/spring
            
            cd server
            ./gradlew build -x test
            pm2 reload hanacare-server || pm2 start build/libs/*.jar --name "hanacare-server"
            
            cd ../client
            npm install --legacy-peer-deps
            npm run build
            pm2 reload hanacare
