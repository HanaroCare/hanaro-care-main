spring:
  config:
    import:
      - classpath:security.yaml
  application:
    name: server

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
      exclude: static/**, public/**, .git/**

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    database-platform: org.hibernate.dialect.MySQL8Dialect

    defer-datasource-initialization: true
    show-sql: false

    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: Asia/Seoul
        order_inserts: true
        order_updates: true
        format_sql: true
        use_sql_comments: true

  sql:
    init:
      mode: always

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  web:
    resources:
      add-mappings: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

cache:
  gemini-ttl: 86400
  welfare-ttl: 3600
  simulation-ttl: 86000
  pension-forecast-ttl: 604800

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

cors:
  # 환경변수로 주입 가능. Docker 배포 시 CORS_ALLOWED_ORIGINS=https://도메인 으로 설정
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

logging:
  level:
    com.server: debug
    org.hibernate.SQL: info

voice:
  upload-dir: ${VOICE_UPLOAD_DIR}
  base-url: ${VOICE_BASE_URL}
  voice-storage-path: ${VOICE_STORAGE_PATH}
